name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vast_test
          POSTGRES_PASSWORD: vast_test
          POSTGRES_DB: vast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vast_test -d vast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://vast_test:vast_test@127.0.0.1:5432/vast_test
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "${{ github.workspace }}:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact /repo
